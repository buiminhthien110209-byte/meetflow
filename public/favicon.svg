<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="meetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6aff" />
      <stop offset="50%" stop-color="#5b8cff" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>
  </defs>
  
  <!-- Nền Squircle bo tròn hiện đại -->
  <rect x="24" y="24" width="464" height="464" rx="136" fill="url(#meetGrad)"/>
  
  <!-- Biểu tượng máy quay cách điệu màu trắng tối giản, tinh tế -->
  <g fill="#ffffff">
    <!-- Thân camera bo tròn mềm mại -->
    <rect x="110" y="156" width="200" height="200" rx="42"/>
    <!-- Ống phóng camera với góc vát mượt -->
    <path d="M 326 212 L 392 168 C 406 159 424 169 424 186 L 424 326 C 424 343 406 353 392 344 L 326 300 Z"/>
    <!-- Ống kính lens bên trong -->
    <circle cx="210" cy="256" r="56" fill="url(#meetGrad)"/>
    <circle cx="210" cy="256" r="26" fill="#ffffff"/>
  </g>
</svg>
